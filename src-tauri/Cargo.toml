[package]
name = "settlers"
version = "0.1.0"
description = "Settlers"
edition = "2021"

[lib]
name = "settlers_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
# The webview embeds a large asset catalogue. Whole-program bitcode exceeds
# Mach-O object limits; game simulation runs in JavaScript, not this shell.
codegen-units = 16
lto = false
opt-level = 3
panic = "abort"
strip = true
