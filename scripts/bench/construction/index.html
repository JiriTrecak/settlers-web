<!doctype html><html><head><meta charset="utf-8"><title>Construction scaffold review</title><style>body{margin:0;background:#151b17;color:#eee;font:14px system-ui}header{position:absolute;top:16px;left:20px;z-index:1;background:#17221ddd;padding:14px;border-radius:10px}label{display:block;margin:8px 0}input{width:300px}canvas{display:block}button,select{font:inherit;padding:5px;margin-right:6px}#status{white-space:pre-line}</style></head><body><header><strong>Shared game renderer · construction</strong><label>Buildings <select id="buildings" aria-label="Building pair"><option value="halls">Main halls</option><option value="barracks">Barracks</option><option value="forges">Forges</option><option value="supply">Supply houses</option></select></label><label>Ownership <select id="colors" aria-label="Player colors"><option value="pair">Red / blue</option><option value="all">Red / blue / green / white</option></select></label><label>Progress <input aria-label="Construction progress" id="progress" type="range" min="0" max="1000" value="650"><output id="percent">65%</output></label><button id="play">Play construction</button><button id="cancel">Cancel buildings</button><label><input id="fog" type="checkbox" style="width:auto">Remembered through fog</label><div id="status">Loading models…</div></header><canvas></canvas><script type="module" src="./main.ts"></script></body></html>
