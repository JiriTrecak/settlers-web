<!doctype html><html><head><style>body{margin:0;background:#101811}#label{position:fixed;top:20px;left:20px;color:#e5d8ae;font:18px Georgia}</style></head><body><div id="label">Aura bearer and recipient · both receive status badges</div><script type="module">
import * as T from '/node_modules/three/build/three.module.js';import {GLTFLoader} from '/node_modules/three/examples/jsm/loaders/GLTFLoader.js';import {createCharacterInstance} from '/src/render/characters/character-player.js';import {StatusBadges} from '/src/render/settlement/statusBadges.ts';import {Game} from '/src/sim/game/game.ts';import {content} from '/src/content/builtin.ts';import {emptyUtcMap} from '/src/shared/map/utcmap.ts';

</script></body></html>
