<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#14201b;color:#eee8cb;font:14px system-ui}main{padding:22px 28px 290px;max-width:1100px;margin:auto}h1{font:28px Georgia}#gallery{display:grid;grid-template-columns:repeat(10,1fr);gap:10px}#gallery button{border:1px solid #716752;background:#0b1411;color:#d6d2bf;font:10px system-ui;padding:5px;cursor:pointer}#gallery img{width:100%;display:block}nav{display:flex;gap:15px;margin:15px 0}nav button{padding:8px}#result{color:#b7d79f}</style></head><body><main><h1>Hero item visual verification</h1><p>Click an icon to equip it. Use inventory icons below to activate. Status badges show effects on the selected recipient.</p><nav><button id="hero">Select bearer</button><button id="ally">Select aura recipient</button><button id="shield">Activate party shield</button></nav><p id="result"></p><div id="gallery"></div></main><script type="module">
import {Game} from '/src/sim/game/game.ts';import {content} from '/src/content/builtin.ts';import {emptyUtcMap} from '/src/shared/map/utcmap.ts';import {SettlementHud} from '/src/ui/settlement/settlementHud.ts';
const g=new Game(emptyUtcMap(),[{player:0,kind:'human'},{player:1,kind:'human'}],content);const hero=g.entities.find(e=>e.equipment&&e.owner==='player.1');
const ally=g.context.create({id:'test-ally',definition:'unit.ants.marshal',owner:'player.1',position:{x:hero.x+1,y:hero.y},rotation:0});ally.readyTick=0;
hero.equipment=['item.broodkeeper-lantern','item.warcaller-standard','item.canopy-aegis','item.trailkeeper-flask','item.deep-moon-scepter','item.rootbinder-idol'];hero.hp-=250;hero.spellcasting.mana=0;
const hud=new SettlementHud(document.body,0,{action:a=>{const result=g.command('player.1',a);document.querySelector('#result').textContent=result.accepted?'Activated':result.reason;refresh()},mode(){},home(){},focus(){}});
function refresh(){g.combat.items.tick();g.observation.update();hud.update(g.view('player.1'),true)}
refresh();hud.setSelection([hero.id]);
document.querySelector('#hero').onclick=()=>hud.setSelection([hero.id]);document.querySelector('#ally').onclick=()=>hud.setSelection([ally.id]);document.querySelector('#shield').onclick=()=>{g.inventory.use(hero,2);refresh();hud.setSelection([ally.id])};
for(const item of content.definitions.filter(d=>d.itemTier).sort((a,b)=>a.itemTier-b.itemTier)) {const button=document.createElement('button'),image=document.createElement('img');image.src='/'+content.asset(item.icon).image;button.append(image,document.createTextNode('T'+item.itemTier+' '+item.name));button.title=item.description;button.onclick=()=>{hero.equipment[5]=item.id;hero.equipmentState??=hero.equipment.map(()=>null);hero.equipmentState[5]=null;refresh();hud.setSelection([hero.id])};document.querySelector('#gallery').append(button)}
</script></body></html>
