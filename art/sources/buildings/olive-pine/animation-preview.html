<!doctype html><html><head><meta charset="utf-8"><title>Pine animations</title><style>body{margin:0;background:#101316;color:#eee;font:14px system-ui}header{padding:16px;display:flex;align-items:center;gap:12px}button,select{padding:9px;background:#343a3e;color:white;border:1px solid #666;border-radius:6px}canvas{display:block}#info{padding:0 16px}input{width:220px}</style><script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script></head><body><header><b>Olive pine · harvesting animations</b><button id="hit">Axe hit</button><button id="fall">Fall</button><button id="decay">Decay</button><button id="sequence">Fall → decay</button><button id="reset">Reset</button><button id="pause">Pause</button><select id="speed"><option value="1">1×</option><option value="0.25">0.25×</option></select><input id="scrub" type="range" min="0" max="1" step=".001" value="0" aria-label="Animation progress"></header><div id="info">Loading…</div><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(devicePixelRatio);document.body.append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color(0);const camera=new T.PerspectiveCamera(40,1,.1,100);camera.position.set(10,8,14);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,2.6,2);controls.update();scene.add(new T.HemisphereLight(0xffeed0,0x303846,2));for(const [p,e] of [[[5,10,6],2],[[-5,5,-4],1]]){const l=new T.DirectionalLight(0xffffff,e);l.position.fromArray(p);scene.add(l);}const grid=new T.GridHelper(18,18,0x303030,0x151515);grid.position.y=.003;scene.add(grid);const ground=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshBasicMaterial({color:0x050505}));ground.rotation.x=-Math.PI/2;ground.position.y=-.001;scene.add(ground);
const gltf=await new GLTFLoader().loadAsync('./olive-pine-animated.glb');scene.add(gltf.scene);const mixer=new T.AnimationMixer(gltf.scene);const clips=Object.fromEntries(gltf.animations.map(c=>[c.name,c]));let active=null,chain=false,paused=false;const info=document.querySelector('#info'),scrub=document.querySelector('#scrub');
function reset(){mixer.stopAllAction();active=null;chain=false;gltf.scene.visible=true;paused=false;scrub.value=0;document.querySelector('#pause').textContent='Pause';}
function play(name,sequence=false){mixer.stopAllAction();gltf.scene.visible=true;active=mixer.clipAction(clips[name]);active.reset().setLoop(T.LoopOnce,1);active.clampWhenFinished=true;active.play();paused=false;chain=sequence;document.querySelector('#pause').textContent='Pause';}
for(const name of ['hit','fall','decay'])document.getElementById(name).onclick=()=>play(name);document.querySelector('#sequence').onclick=()=>play('fall',true);document.querySelector('#reset').onclick=reset;document.querySelector('#pause').onclick=e=>{paused=!paused;if(active)active.paused=paused;e.target.textContent=paused?'Resume':'Pause';};scrub.oninput=()=>{if(active){paused=true;active.paused=true;document.querySelector('#pause').textContent='Resume';gltf.scene.visible=true;active.time=+scrub.value*active.getClip().duration;mixer.update(0);}};
mixer.addEventListener('finished',e=>{if(e.action!==active)return;if(e.action.getClip().name==='fall'&&chain)play('decay');else if(e.action.getClip().name==='decay')gltf.scene.visible=false;});
let last=performance.now();function frame(now){requestAnimationFrame(frame);let dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){mixer.update(dt*+document.querySelector('#speed').value);}if(active){scrub.value=active.time/active.getClip().duration;info.textContent=active.getClip().name+' · '+active.time.toFixed(2)+' / '+active.getClip().duration.toFixed(2)+' s';}else info.textContent='Ready · hit 0.60 s · fall 1.80 s · decay 6.00 s · drag to orbit';renderer.render(scene,camera);}function resize(){renderer.setSize(innerWidth,innerHeight-100);camera.aspect=innerWidth/(innerHeight-100);camera.updateProjectionMatrix();}addEventListener('resize',resize);resize();requestAnimationFrame(frame);
</script></body></html>
